syntax = "proto3";

package proto;

option go_package = "github.com/edaywalid/sched/proto";

service EngineService {
  rpc StartWorkflow(StartWorkflowRequest) returns (StartWorkflowResponse);
  
  rpc PollWorkflowTask(PollWorkflowTaskRequest)
      returns (PollWorkflowTaskResponse);
  
  rpc CompleteWorkflowTask(CompleteWorkflowTaskRequest)
      returns (CompleteWorkflowTaskResponse);
  
  rpc CompleteActivity(CompleteActivityRequest)
      returns (CompleteActivityResponse);

  rpc RecordActivityHeartbeat(RecordActivityHeartbeatRequest)
      returns (RecordActivityHeartbeatResponse);
  
  rpc PollActivityTask(PollActivityTaskRequest)
      returns (PollActivityTaskResponse);
  
  rpc SignalWorkflow(SignalWorkflowRequest) returns (SignalWorkflowResponse);

  rpc CancelWorkflow(CancelWorkflowRequest) returns (CancelWorkflowResponse);

  rpc WaitForSignal(WaitForSignalRequest) returns (WaitForSignalResponse);

  rpc RegisterWorkflowTimer(RegisterWorkflowTimerRequest)
      returns (RegisterWorkflowTimerResponse);
  
  rpc GetWorkflowStatus(GetWorkflowStatusRequest) 
      returns (GetWorkflowStatusResponse);
  
  rpc ScheduleActivity(ScheduleActivityRequest)
      returns (ScheduleActivityResponse);
  
  // Dashboard query methods
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  
  rpc GetWorkflowDetails(GetWorkflowDetailsRequest) 
      returns (GetWorkflowDetailsResponse);
  
  rpc GetWorkflowMetrics(GetWorkflowMetricsRequest)
      returns (GetWorkflowMetricsResponse);
}

message StartWorkflowRequest {
  string workflow_name = 1;
  bytes input = 2;
  // Optional. When > 0 the engine schedules a durable timer; when it
  // fires, the workflow is marked TIMED_OUT unless it has already
  // reached a terminal state.
  int32 workflow_execution_timeout_seconds = 3;
}

message StartWorkflowResponse {
  string workflow_id = 1;
  string run_id = 2;
}

message CompleteActivityRequest {
  string task_token = 1;
  bytes result = 2;
  string error = 3;
}

message CompleteActivityResponse {
  bool success = 1;
}

message RecordActivityHeartbeatRequest {
  string task_token = 1;
  // Optional opaque details, surfaced to dashboard observers. Not used
  // for decisions; only the reset-the-visibility-timeout side-effect
  // happens server-side.
  bytes details = 2;
}

message RecordActivityHeartbeatResponse {
  bool success = 1;
  // True when the activity has been cancelled and the worker should
  // abort the current attempt. Phase 3 does not yet implement
  // cancellation — always false.
  bool cancel_requested = 2;
}

message PollActivityTaskRequest {
  string task_queue = 1;
  int32 timeout_seconds = 2;
}

message PollActivityTaskResponse {
  string task_token = 1;
  string activity_name = 2;
  bytes input = 3;
  string workflow_id = 4;
}

message SignalWorkflowRequest {
  string workflow_id = 1;
  string signal_name = 2;
  bytes input = 3;
}

message SignalWorkflowResponse {
  bool success = 1;
}

message CancelWorkflowRequest {
  string workflow_id = 1;
  string reason = 2;
}

message CancelWorkflowResponse {
  bool success = 1;
}

message WaitForSignalRequest {
  string workflow_id = 1;
  int32 timeout_seconds = 2;
}

message WaitForSignalResponse {
  // Empty signal_name means the wait timed out.
  string signal_name = 1;
  bytes input = 2;
}

message RegisterWorkflowTimerRequest {
  string workflow_id = 1;
  int32 duration_seconds = 2;
}

message RegisterWorkflowTimerResponse {
  string timer_id = 1;
}

message GetWorkflowStatusRequest {
  string workflow_id = 1;
}

message GetWorkflowStatusResponse {
  string status = 1;
  bytes result = 2;
  string error = 3;
}

message PollWorkflowTaskRequest {
  string task_queue = 1;
  int32 timeout_seconds = 2;
}

message PollWorkflowTaskResponse {
  string task_token = 1;
  string workflow_name = 2;
  bytes input = 3;
  string workflow_id = 4;
  string run_id = 5;
  // History is the durable event log for this workflow up to (but not
  // including) the dispatch of this workflow task. Phase 3.4b will use
  // this for deterministic replay; today the SDK only logs the length.
  repeated WorkflowEvent history = 6;
}

message CompleteWorkflowTaskRequest {
  string task_token = 1;
  bytes result = 2;
  string error = 3;
  // Yielded indicates the workflow function paused on a blocking
  // command (WaitForSignal) without a matching event in history. The
  // engine should not mark the workflow terminal and will re-dispatch
  // a new workflow task when relevant history events arrive.
  bool yielded = 4;
}

message CompleteWorkflowTaskResponse {
  bool success = 1;
}

message ScheduleActivityRequest {
  string workflow_id = 1;
  string activity_name = 2;
  bytes input = 3;
}

message ScheduleActivityResponse {
  string activity_id = 1;
}

// Dashboard query messages
message ListWorkflowsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string status_filter = 3; // "running", "completed", "failed", or empty for all
}

message WorkflowExecutionInfo {
  string workflow_id = 1;
  string run_id = 2;
  string workflow_name = 3;
  string status = 4;
  int64 start_time = 5; // Unix timestamp
  int64 end_time = 6;   // Unix timestamp
  string result = 7;
  string error = 8;
}

message ListWorkflowsResponse {
  repeated WorkflowExecutionInfo workflows = 1;
  string next_page_token = 2;
}

message GetWorkflowDetailsRequest {
  string workflow_id = 1;
}

message WorkflowEvent {
  string event_type = 1;
  int64 timestamp = 2;
  string details = 3;
}

message GetWorkflowDetailsResponse {
  WorkflowExecutionInfo execution = 1;
  repeated WorkflowEvent history = 2;
}

message GetWorkflowMetricsRequest {
  int64 start_time = 1; // Unix timestamp
  int64 end_time = 2;   // Unix timestamp
}

message WorkflowMetrics {
  int32 total_workflows = 1;
  int32 running_workflows = 2;
  int32 completed_workflows = 3;
  int32 failed_workflows = 4;
  double avg_execution_time_ms = 5;
  map<string, int32> workflows_by_type = 6;
}

message GetWorkflowMetricsResponse {
  WorkflowMetrics metrics = 1;
}
