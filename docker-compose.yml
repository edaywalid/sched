services:
  redis:
    image: redis:7-alpine
    container_name: sched-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - sched-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: sched-postgres
    environment:
      POSTGRES_DB: sched
      POSTGRES_USER: sched
      POSTGRES_PASSWORD: sched_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sched-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sched"]
      interval: 5s
      timeout: 3s
      retries: 5

  engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    container_name: sched-engine
    ports:
      - "50051:50051"  
    environment:
      - ENGINE_PORT=50051
      - REDIS_ADDR=redis:6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=sched
      - POSTGRES_USER=sched
      - POSTGRES_PASSWORD=sched_password
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - sched-network
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: sched-dashboard
    ports:
      - "8080:8080"    # Web Dashboard
    environment:
      - ENGINE_ADDRESS=engine:50051
      - DASHBOARD_PORT=8080
    depends_on:
      - engine
    networks:
      - sched-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: sched-worker
    environment:
      - ENGINE_ADDRESS=engine:50051
      - TASK_QUEUE=default
      # Uncomment for demo mode (auto-starts test workflows):
      # - AUTO_START_TEST=true
    depends_on:
      - engine
    networks:
      - sched-network
    restart: unless-stopped
    # Scale workers with: docker-compose up --scale worker=3

networks:
  sched-network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
