version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      otel:
        patterns:
          - go.opentelemetry.io/*
      prometheus:
        patterns:
          - github.com/prometheus/*
      grpc:
        patterns:
          - google.golang.org/grpc*
          - google.golang.org/protobuf

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
